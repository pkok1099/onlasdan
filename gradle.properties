
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseG1GC

# Speed up local builds (incl. lint) with Gradle caches.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Do not hardcode a JDK path (breaks CI). Use JAVA_HOME / toolchains instead.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.warning.mode=none
android.disallowKotlinSourceSets=false
android.lint.incremental=true
android.lint.checkReleaseBuilds=false
kotlin.incremental=true
ksp.incremental=true

# onlasdan release versioning (single source of truth).
# versionCode = MAJOR*10000 + MINOR*100 + PATCH (monotonik naik).
onlasdan.versionCode=10250
onlasdan.versionName=1.2.2-beta.5
