# Detekt — gerbang kualitas onlasdan.
# Fokus utama kompleksitas; dilengkapi aturan lintas-ruleset hasil ukur
# 2026-10-22 (aturan yang diaktifkan = yang terukur di codebase ini).
# Format diurus Spotless/ktlint, error statis diurus Android Lint.
build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: true

complexity:
  active: true
  CognitiveComplexMethod:
    active: true
    threshold: 15
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreSimpleWhenEntries: true
  LargeClass:
    active: true
    threshold: 300
  LongMethod:
    active: true
    threshold: 30
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    ignoreDataClasses: true
    ignoreDefaultParameters: true
  NestedBlockDepth:
    active: true
    threshold: 4
  NestedScopeFunctions:
    active: true
  StringLiteralDuplication:
    active: false
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 15
    ignoreDeprecated: false
    ignorePrivate: false
    ignoreOverridden: true
  MethodOverloading:
    active: false
  ComplexCondition:
    active: true
    threshold: 4

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true

exceptions:
  active: true
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  ImplicitDefaultLocale:
    active: true
  UnreachableCode:
    active: true

style:
  active: true
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview']
  MagicNumber:
    active: false
  ForbiddenComment:
    active: false

comments:
  active: false
naming:
  active: false
performance:
  active: false
